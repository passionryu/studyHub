spring:
  application:
    name: studyhub-server
  data:
    redis:
      host: ${STUDYHUB_REDIS_HOST:localhost}
      port: ${STUDYHUB_REDIS_PORT:6379}
  profiles:
    group:
      local:
        - local
    include:
      - datasource

server:
  port: 3001

management:
  endpoints:
    web:
      exposure:
        include: health,info

studyhub:
  security:
    jwt:
      secret: ${STUDYHUB_JWT_SECRET:local-studyhub-jwt-secret-must-be-changed}
      access-token-expiration: ${STUDYHUB_ACCESS_TOKEN_EXPIRATION:1h}
      refresh-token-expiration: ${STUDYHUB_REFRESH_TOKEN_EXPIRATION:7d}
